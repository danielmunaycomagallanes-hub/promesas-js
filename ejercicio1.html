<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de planetas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #c8ccd3;
      display: flex;
      justify-content: center;
      padding: 40px;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 8px;
      width: 300px;
    }
    div { margin-bottom: 10px; }
    label { display: block; margin-bottom: 3px; }
    input { width: 100%; padding: 6px; }
    button { padding: 6px 12px; }
  </style>
</head>
<body>

  <form action="" id="formBuscador">
    <div>
      <input type="text" id="idplaneta" placeholder="Ejemplo: 1">
      <button type="submit">Buscar</button>
    </div>

    <div>
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre">
    </div>

    <div>
      <label for="gravedad">Gravedad:</label>
      <input type="text" id="gravedad">
    </div>

    <div>
      <label for="agua">Agua en superficie (%):</label>
      <input type="text" id="agua">
    </div>

    <div>
      <label for="poblacion">Población:</label>
      <input type="text" id="poblacion">
    </div>

    <div>
      <label for="orbita">Días por año (órbita):</label>
      <input type="text" id="orbita">
    </div>
  </form>
  <script>

    const formulario = document.getElementById('formBuscador')
    const id = document.getElementById('idplaneta')
    const nombre = document.getElementById('nombre')
    const gravedad = document.getElementById('gravedad')
    const agua = document.getElementById('agua')
    const poblacion = document.getElementById('poblacion')
    const orbita = document.getElementById('orbita')

    formulario.addEventListener("submit", (event) => {
      event.preventDefault()  

      obtenerPlaneta(id.value)
    })

    async function obtenerPlaneta(id) {
      const API_URL = `https://swapi.dev/api/planets/${id}/`

      try {
        const respuesta = await fetch(API_URL)

        if (!respuesta.ok) {
          if (respuesta.status === 404) {
            nombre.value = ''
            gravedad.value = ''
            agua.value = ''
            poblacion.value = ''
            orbita.value = ''
            alert('No existe este planeta')
          }
          throw new Error(`Error de comunicación`)
        }
        const datos = await respuesta.json()

        nombre.value = datos.name
        gravedad.value = datos.gravity
        agua.value = datos.surface_water
        poblacion.value = datos.population
        orbita.value = datos.orbital_period

      } catch (e) {
        console.error(e)
      }
    }
  </script>
</body>
</html>
